# Sub-daily automation (Vercel Hobby cannot run hourly crons).
# Required repo secrets (MUST match Vercel env):
#   APP_BASE_URL  — your Insights Hour public URL (no trailing slash)
#   CRON_SECRET   — EXACT same value as CRON_SECRET on the Vercel app
# Also set TURSO_DATABASE_URL + TURSO_AUTH_TOKEN on Vercel so data survives cold starts.
#
# If Actions show "Secrets missing" or HTTP 401, the hourly refresh is NOT running.
# Fix: GitHub → Settings → Secrets → set APP_BASE_URL + CRON_SECRET to match Vercel.

name: Automation cron

on:
  schedule:
    - cron: "5 * * * *"       # hourly: RSS + festive summarize
    - cron: "25 * * * *"      # hourly: website + Instagram + LinkedIn festive discovery
    - cron: "20 */3 * * *"    # every ~3h: metered NewsAPI + GNews
    - cron: "35 */5 * * *"    # every ~5h: festive intelligence + email
  workflow_dispatch:
    inputs:
      job:
        description: "Which cron to run"
        required: true
        default: "hourly"
        type: choice
        options:
          - hourly
          - scrape
          - metered
          - festive

jobs:
  hourly:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '5 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'hourly')
    runs-on: ubuntu-latest
    steps:
      - name: Hourly free feeds + festive summarize
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Missing GitHub secrets APP_BASE_URL and/or CRON_SECRET. Set them to match Vercel (same CRON_SECRET value)."
            exit 1
          fi
          # Trim accidental whitespace/newlines from secret paste
          APP_BASE_URL=$(printf '%s' "$APP_BASE_URL" | tr -d '\r' | sed 's/[[:space:]]*$//')
          CRON_SECRET=$(printf '%s' "$CRON_SECRET" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s/^"//;s/"$//;s/^'"'"'//;s/'"'"'$//')
          echo "APP_BASE_URL length=${#APP_BASE_URL} CRON_SECRET length=${#CRON_SECRET}"
          ping_code=$(curl -sS -o /tmp/cron-ping.json -w "%{http_code}" -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: github-actions-cron" \
            --max-time 60 \
            "${APP_BASE_URL%/}/api/cron/ping" || true)
          echo "ping HTTP ${ping_code}"
          head -c 500 /tmp/cron-ping.json || true
          echo
          if [ "$ping_code" = "401" ]; then
            echo "::error::401 — GitHub CRON_SECRET ≠ Vercel CRON_SECRET. Copy the exact value from Vercel Environment Variables into GitHub Actions secret CRON_SECRET."
            exit 1
          fi
          code=$(curl -sS -o /tmp/cron-out.json -w "%{http_code}" -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: github-actions-cron" \
            --max-time 280 \
            "${APP_BASE_URL%/}/api/cron/refresh-hourly" || true)
          echo "HTTP ${code}"
          head -c 2000 /tmp/cron-out.json || true
          echo
          if [ "$code" = "401" ]; then
            echo "::error::401 Unauthorized — CRON_SECRET in GitHub does not match Vercel CRON_SECRET. Update both to the same value and redeploy."
            exit 1
          fi
          test "$code" = "200"

  scrape:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '25 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'scrape')
    runs-on: ubuntu-latest
    steps:
      - name: Website + Instagram + LinkedIn festive scrape
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Missing GitHub secrets APP_BASE_URL and/or CRON_SECRET."
            exit 1
          fi
          # Websites → Instagram round-robin → LinkedIn festive discovery (free RSS).
          code=$(curl -sS -o /tmp/cron-scrape.json -w "%{http_code}" -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: github-actions-cron" \
            --max-time 280 \
            "${APP_BASE_URL%/}/api/cron/scrape-targets" || true)
          echo "HTTP ${code}"
          head -c 2000 /tmp/cron-scrape.json || true
          echo
          if [ "$code" = "401" ]; then
            echo "::error::401 Unauthorized — sync CRON_SECRET between GitHub Actions and Vercel."
            exit 1
          fi
          test "$code" = "200"

  metered:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '20 */3 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'metered')
    runs-on: ubuntu-latest
    steps:
      - name: Metered NewsAPI + GNews (~3h)
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Missing GitHub secrets APP_BASE_URL and/or CRON_SECRET."
            exit 1
          fi
          code=$(curl -sS -o /tmp/cron-out.json -w "%{http_code}" -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: github-actions-cron" \
            --max-time 280 \
            "${APP_BASE_URL%/}/api/cron/refresh-metered" || true)
          echo "HTTP ${code}"
          head -c 2000 /tmp/cron-out.json || true
          echo
          if [ "$code" = "401" ]; then
            echo "::error::401 Unauthorized — sync CRON_SECRET between GitHub Actions and Vercel."
            exit 1
          fi
          test "$code" = "200"

  festive:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '35 */5 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'festive')
    runs-on: ubuntu-latest
    steps:
      - name: Festive intelligence + email (~5h)
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Missing GitHub secrets APP_BASE_URL and/or CRON_SECRET."
            exit 1
          fi
          code=$(curl -sS -o /tmp/cron-out.json -w "%{http_code}" -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: github-actions-cron" \
            --max-time 280 \
            "${APP_BASE_URL%/}/api/cron/festive-intelligence" || true)
          echo "HTTP ${code}"
          head -c 2000 /tmp/cron-out.json || true
          echo
          if [ "$code" = "401" ]; then
            echo "::error::401 Unauthorized — sync CRON_SECRET between GitHub Actions and Vercel."
            exit 1
          fi
          test "$code" = "200"
